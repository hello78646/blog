---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    <span class="date">{{ page.date | date: '%Y-%m-%d' }}</span>
    {% if page.categories %}
      · <span class="cat">{{ page.categories | join: ' / ' }}</span>
    {% endif %}
    {% if page.tags %}
      · <span class="tags">标签：{{ page.tags | join: '、' }}</span>
    {% endif %}
  </p>

  <div class="post-content">
    {{ content }}
  </div>
</article>
